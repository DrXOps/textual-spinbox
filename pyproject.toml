[project]
name = "textual-spinbox"
version = "0.9.0"
description = "A simple spinbox widget for Textual (fixed for Textual 8.x)"
authors = [
    { name = "DrXOps" }
]
requires-python = ">=3.10"
dependencies = [
    "textual>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
spinbox_demo = "textual_spinbox.demo:exec_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pylint."messages control"]
allowed-redefined-builtins = [ 'id' ]
